name: Build ESP32-P4 firmware

on:
  push:
    paths:
      - 'device-jc8012p4a1.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome==2025.12.0

      - name: Compile firmware
        run: esphome compile device-jc8012p4a1.yaml

      - name: Copy firmware
        run: |
          mkdir -p output
          cp .esphome/build/**/.pioenvs/**/firmware.factory.bin output/ 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: output/
